# Build the GPU node image (perception + identity) and push it to GHCR.
#
# WHY CI RATHER THAN A LAPTOP: the image targets linux/amd64 and the dev Macs
# are arm64. buildx can emulate through QEMU, but installing the torch/CUDA
# layers under emulation takes hours and the build-time smoke test would run
# without a GPU present. `ubuntu-latest` is native amd64, so it is the only
# practical builder we have.
#
# WHY MANUAL BY DEFAULT: `main` is developmental — Railway deliberately does
# not auto-deploy from it. Auto-shipping GPU code that watches patients off a
# developmental branch would contradict that. Pushing a `gpu-v*` tag is the
# release gate, and workflow_dispatch covers everything else.
#
# The image stays PRIVATE. It does not contain the gated facebook/sam3.1
# weights (those are fetched at first boot), but it does contain all of src/.
name: build-gpu-image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag (default: short SHA)"
        required: false
        type: string
  push:
    tags: ["gpu-v*"]

concurrency:
  # One build per ref. A superseded build is wasted runner minutes on
  # something like a 9GB image.
  group: build-gpu-image-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE: ${{ github.repository_owner }}/memoria-gpu

jobs:
  test:
    # Gate the build on the suite. Cheap (~45s) next to a multi-GB image
    # build, and it catches the import-level breakage that would otherwise
    # only surface in the Dockerfile's smoke step 20 minutes in.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # uv + the checked-in lockfile, NOT a hand-rolled pip sequence. The
      # first-ever run of this workflow (2026-08-12) died in pip with
      # ResolutionImpossible while the identical resolve succeeded both
      # locally and in a clean amd64 container — pip re-resolving from
      # scratch is a second resolver that can disagree with the one we
      # actually develop against. `uv sync --frozen` installs exactly
      # uv.lock (CPU-index torch included, via [tool.uv.sources]), so CI
      # tests the environment the laptop already proved.
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install locked deps
        run: uv sync --frozen

      - name: Unit tests
        run: uv run pytest test/unit -q

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Lets the built-in GITHUB_TOKEN push to GHCR — no PAT, nothing
      # long-lived in secrets.
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        # The runner ships ~14GB free; this image plus its build cache needs
        # more. Dropping the preinstalled Android/dotnet/Haskell toolchains
        # reclaims ~25GB and costs about a minute.
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          df -h /

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve tag
        id: tag
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            echo "value=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "value=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "value=sha-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: gpu/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ steps.tag.outputs.value }}
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:latest
          # GHA cache keeps the ~40min upstream-clone + pip layers warm across
          # builds. Only the COPY layers rebuild when our code changes.
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Recorded so `docker inspect` answers "what is running on this
          # node?" without archaeology.
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Summary
        run: |
          {
            echo "### GPU image pushed"
            echo ""
            echo '```'
            echo "${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ steps.tag.outputs.value }}"
            echo '```'
            echo ""
            echo "Deploy it with:"
            echo '```bash'
            echo "scripts/pod.sh release ${{ steps.tag.outputs.value }}"
            echo '```'
            echo ""
            echo "Checkpoints are NOT in this image — the node fetches them on"
            echo "first boot into its network volume. HUGGINGFACE_TOKEN must be"
            echo "set on the node for the gated facebook/sam3.1 grounder."
          } >> "$GITHUB_STEP_SUMMARY"
