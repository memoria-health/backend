# Run nemara-backend as a managed container against the Supabase-CLI local
# stack (which you start separately: `make db-start` / `supabase start`).
#
# This replaces ad-hoc backgrounded `uvicorn` host processes: one container,
# `make backend-up` / `make backend-down`, and `docker compose down` reaps it
# cleanly. No more orphaned uvicorn/ngrok lingering across sessions.
#
# This file lives in docker/, so every relative path resolves from HERE:
#   build context -> ..        (repo root, for the Dockerfile COPY paths)
#   env_file      -> ../.env
#   src mount     -> ../src
name: memoria-backend

services:
  backend:
    container_name: memoria-backend
    build:
      context: ..
      dockerfile: docker/Dockerfile.dev
    # All config + secrets come straight from the local .env.
    env_file: ../.env
    environment:
      # .env points the DB at 127.0.0.1:54342 — inside the container that is
      # the container itself. Reach the host-published Supabase DB instead.
      NEMARA_DB_URL: "postgresql+asyncpg://postgres:postgres@host.docker.internal:54342/postgres"
      # NEMARA_SUPABASE_URL is intentionally NOT overridden: it must stay the
      # host LAN IP from .env, because the backend both CALLS Supabase with it
      # AND hands the iOS app signed storage URLs built from it (split horizon
      # — one address must work for both the container and the device).
      # Re-ID off locally — the dev image skips the ML model bake.
      NEMARA_REID_ENABLED: "false"
      PORT: "8002"
      # uvicorn --reload's watcher (watchfiles) does NOT receive inotify
      # events across the macOS Docker bind-mount, so source edits were
      # silently never reloaded — the running process kept executing stale
      # code (a "fixed but still broken" landmine that repeatedly resurfaced
      # the online/offline bug). Force polling so --reload actually fires,
      # mirroring the web container's WATCHPACK/CHOKIDAR polling above.
      WATCHFILES_FORCE_POLLING: "true"
    ports:
      - "8002:8002"
    # Lets the container resolve host.docker.internal on Linux too (Docker
    # Desktop on macOS provides it automatically; harmless to declare).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Bind-mount source for hot reload (uvicorn --reload watches /app/src).
    volumes:
      - ../src:/app/src
      # Soak observability: identity-evidence frames + out/ artifacts the
      # backend writes must be readable from the host (dashboard, review).
      - ../out:/app/out
    # Dev: never auto-restart, so `make backend-down` / Ctrl-stop is final.
    restart: "no"

  # The caregiver dashboard (separate repo: ../../nemara-web-app), wired into
  # the same stack so `make stack-up` brings up Supabase + backend + dashboard
  # in one shot. Behind the `web` profile so the lean `make backend-up` stays
  # backend-only (and a web build failure can't block the backend).
  web:
    container_name: memoria-web
    profiles: ["web"]
    build:
      context: ../../nemara-web-app
      dockerfile: Dockerfile.dev
    # NEXT_PUBLIC_* (backend URL, Supabase, LiveKit) come from the
    # bind-mounted .env.local, which uses the host LAN IP so it resolves from
    # BOTH the browser AND this container's server-side fetches (Next.js does
    # both). Polling makes file-watching reliable across the macOS bind-mount.
    environment:
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "3000:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../../nemara-web-app:/app
      # Anonymous volumes: keep the image's node_modules + container-local
      # .next out of the host bind-mount (perf + avoids cloud-sync dup files).
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend
    restart: "no"
