[project]
name = "nemara-backend"
version = "0.0.1"
description = "Nemara caregiver-app backend (FastAPI + Supabase)"
requires-python = ">=3.12,<3.14"
readme = "README.md"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    "pyjwt[crypto]>=2.10",
    "httpx>=0.27",
    "python-dotenv>=1.2.2",
    "logfire[fastapi,sqlalchemy,asyncpg]>=2.0",
    "typer>=0.15",
    # ── Phase 0 detector pipeline ────────────────────────────────────
    # `google-genai` is the current Gemini Python SDK (replaces the older
    # `google-generativeai`). Supports inline video parts and JSON
    # response schemas — matches the dashboard's TS path.
    "google-genai>=1.0",
    "openai>=1.55",
    # FastAPI's multipart/form-data parser. Required for the clip ingest
    # endpoint that takes a 15s MP4 upload from the wall phone.
    "python-multipart>=0.0.18",
    # bcrypt is used for the per-camera api_key_hash stored on `cameras`.
    # Matches the dashboard's bcryptjs(rounds=10) — see scripts/e2e/cli.py
    # for the verification path.
    "bcrypt>=4.2",
    # LiveKit server SDK — token minting + `WebhookReceiver` for
    # signature validation on the `/v1/livekit/webhooks` route.
    "livekit-api>=1.0",
    # LiveKit participant SDK — the detector subscriber-bot
    # (Phase 2) uses `rtc.Room`, `rtc.VideoStream`, `rtc.AudioStream`
    # to pull frames + PCM off the SFU instead of receiving multipart
    # clip uploads from the wall phone.
    "livekit==1.1.13",
    # HTTP/2 support for httpx. APNs requires HTTP/2 on the push
    # endpoint, and Phase 4's clip-archival path benefits from
    # connection multiplexing against Supabase Storage as well.
    "h2>=4.1",
    # ── Phase 5: Pi camera ingest ────────────────────────────────────
    # Pillow decodes JPEG bytes from the Raspberry Pi's MJPEG stream
    # into RGB arrays. The relay re-encodes those frames as I420 for
    # LiveKit using pure NumPy color-conversion. Pillow is the
    # lightweight choice (~3 MB) over OpenCV (~80 MB) since the only
    # operation we need from it is JPEG decode.
    "pillow>=11.0",
    # ── Re-ID pipeline (face identification) ─────────────────────────
    # InsightFace bundles SCRFD (face detector) + ArcFace (face
    # embedding) under a single FaceAnalysis API. The `buffalo_l`
    # model pack is ~280MB and pre-downloaded at Dockerfile build
    # time so the first tick after deploy doesn't pay the cold-
    # download cost.
    "insightface>=0.7.3",
    "onnxruntime>=1.16",
    # onnx 1.19 references `ml_dtypes.float4_e2m1fn` which only exists
    # in ml_dtypes>=0.5; but torch / tensorflow / jax in the wider
    # graph hold ml_dtypes at 0.4.x. Pinning onnx<1.19 keeps the
    # resolver happy. Revisit once the ML-stack graph upgrades
    # ml_dtypes.
    "onnx<1.19",
    # OpenCV is required by InsightFace for image decode + alignment.
    # The `headless` variant skips GUI deps (no X11 in the container).
    "opencv-python-headless>=4.9",
    # ── Body Re-ID stack (mirrors nemara-reid-experiment) ────────────
    # ultralytics ships YOLO11n (~6MB weights) for person detection.
    # boxmot wraps BoT-SORT + OSNet body-appearance Re-ID (~10MB weights
    # for osnet_x0_25_msmt17). Both pull torch as a hard dep, which is
    # what dominates the image size (~500MB for CPU-only torch). We
    # accept this so the production pipeline matches the experiment
    # exactly: body tracks carry the patient identity through frames
    # where the face is occluded, pointed away, or motion-blurred (e.g.,
    # the exact moment of a fall).
    "ultralytics>=8.3",
    "boxmot>=11.0",
    "torch>=2.0",
    # torchvision is pulled transitively by ultralytics/boxmot, but it
    # MUST be declared here: `[tool.uv.sources]` only redirects DIRECT
    # dependencies, so left transitive it resolved from plain PyPI while
    # torch came from the CPU index. The ABI mismatch that produced was
    # not a warning — the censor died at import with
    # `RuntimeError: operator torchvision::nms does not exist`.
    # Declaring it keeps both halves of the pair on the same index.
    "torchvision>=0.15",
    # numpy is a transitive dep of several others; pin explicitly
    # because both the Re-ID code and the Pi motion detector / JPEG-to-
    # I420 path import it directly. Upper bound matches the boxmot
    # constraint from the experiment's pyproject; the Pi-side numpy
    # usage is basic array ops so 1.26.x works fine.
    "numpy>=1.26,<2.0",
    "aioboto3>=15.5.0",
    "webrtcvad-wheels>=2.0.14",
]

[project.scripts]
e2e = "scripts.e2e.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=1.0",
    "ruff>=0.7",
    "mypy>=1.13",
    "types-pyjwt>=1.7",
]

# ── torch: CPU-only wheels ──────────────────────────────────────────
# The backend NEVER uses CUDA. Its only torch call is
# `torch.set_num_threads(1)` in detection/censor.py, and inference runs
# single-threaded on CPU by design (the 2026-07-28 libomp deadlock fix).
# Default PyPI ships the CUDA build on Linux, which dragged ~2.9 GB of
# `nvidia/*` runtime libraries plus a 659 MB `triton` GPU kernel
# compiler into a 10.1 GB image — all of it unreachable, since
# `torch.cuda.is_available()` is False in the container.
#
# This does NOT affect the GPU box: `requirements-gpu.txt` +
# `scripts/pod/gpu_setup.sh` install CUDA torch from the cu124 index on
# their own, deliberately outside this lock.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src", "scripts"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]
ignore = ["E501"]  # line length handled by formatter

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["test"]
# gpu/ holds the GPU-host deployables (perception, identity). On the pod
# they import as top-level modules (PYTHONPATH=/workspace/nemara); adding
# gpu/ here keeps ONE module name in both worlds.
pythonpath = [".", "gpu"]
