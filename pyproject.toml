[project]
name = "nemara-backend"
version = "0.0.1"
description = "Nemara caregiver-app backend (FastAPI + Supabase)"
requires-python = ">=3.12,<3.14"
readme = "README.md"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    "pyjwt[crypto]>=2.10",
    "httpx>=0.27",
    "python-dotenv>=1.2.2",
    "logfire[fastapi,sqlalchemy,asyncpg]>=2.0",
    "typer>=0.15",
    # ── Phase 0 detector pipeline ────────────────────────────────────
    # `google-genai` is the current Gemini Python SDK (replaces the older
    # `google-generativeai`). Supports inline video parts and JSON
    # response schemas — matches the dashboard's TS path.
    "google-genai>=1.0",
    "openai>=1.55",
    # FastAPI's multipart/form-data parser. Required for the clip ingest
    # endpoint that takes a 15s MP4 upload from the wall phone.
    "python-multipart>=0.0.18",
    # bcrypt is used for the per-camera api_key_hash stored on `cameras`.
    # Matches the dashboard's bcryptjs(rounds=10) — see scripts/e2e/cli.py
    # for the verification path.
    "bcrypt>=4.2",
    # LiveKit server SDK — token minting + `WebhookReceiver` for
    # signature validation on the `/v1/livekit/webhooks` route.
    "livekit-api>=1.0",
    # LiveKit participant SDK — the detector subscriber-bot
    # (Phase 2) uses `rtc.Room`, `rtc.VideoStream`, `rtc.AudioStream`
    # to pull frames + PCM off the SFU instead of receiving multipart
    # clip uploads from the wall phone.
    "livekit>=1.0",
    # HTTP/2 support for httpx. APNs requires HTTP/2 on the push
    # endpoint, and Phase 4's clip-archival path benefits from
    # connection multiplexing against Supabase Storage as well.
    "h2>=4.1",
    # ── Re-ID pipeline (face identification) ─────────────────────────
    # InsightFace bundles SCRFD (face detector) + ArcFace (face
    # embedding) under a single FaceAnalysis API. The `buffalo_l`
    # model pack is ~280MB and pre-downloaded at Dockerfile build
    # time so the first tick after deploy doesn't pay the cold-
    # download cost.
    "insightface>=0.7.3",
    "onnxruntime>=1.16",
    # OpenCV is required by InsightFace for image decode + alignment.
    # The `headless` variant skips GUI deps (no X11 in the container).
    "opencv-python-headless>=4.9",
    # ── Body Re-ID stack (mirrors nemara-reid-experiment) ────────────
    # ultralytics ships YOLO11n (~6MB weights) for person detection.
    # boxmot wraps BoT-SORT + OSNet body-appearance Re-ID (~10MB weights
    # for osnet_x0_25_msmt17). Both pull torch as a hard dep — that's
    # what dominates the image size (~500MB for CPU-only torch). We
    # accept this so the production pipeline matches the experiment
    # exactly: body tracks carry the patient identity through frames
    # where the face is occluded / pointed away / motion-blurred (e.g.,
    # the exact moment of a fall).
    "ultralytics>=8.3",
    "boxmot>=11.0",
    "torch>=2.0",
    # numpy is already a transitive dep of several others; pin
    # explicitly because the Re-ID code uses it directly. <2.0 to
    # match the boxmot constraint from the experiment's pyproject.
    "numpy>=1.26,<2.0",
]

[project.scripts]
e2e = "scripts.e2e.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=1.0",
    "ruff>=0.7",
    "mypy>=1.13",
    "types-pyjwt>=1.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src", "scripts"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]
ignore = ["E501"]  # line length handled by formatter

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["test"]
